name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Debug APK
    # на тег собирается только подписанный релиз, debug не дублируем
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lad-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверить секреты подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет KEYSTORE_BASE64 — добавьте Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

      - name: Unpack keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/lad.jks"
          echo "keystore size: $(stat -c%s "$RUNNER_TEMP/keystore/lad.jks") bytes"

      # Если base64 обрезан или пароль не совпадает — падаем здесь с понятным текстом,
      # а не внутри Gradle с «Keystore was tampered with».
      - name: Проверить keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/keystore/lad.jks"
          ALIAS="${KEY_ALIAS:-lad}"
          SIZE=$(stat -c%s "$KS")
          if [ "$SIZE" -ne 2594 ]; then
            echo "::error::KEYSTORE_BASE64 дал $SIZE байт вместо 2594 — значение секрета обрезано или искажено при вставке"
            exit 1
          fi
          if OUT=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" 2>&1); then
            echo "$OUT" | head -3
          else
            echo "::error::keytool не открыл keystore: $(echo "$OUT" | tail -1). Проверьте KEYSTORE_PASSWORD и KEY_ALIAS"
            exit 1
          fi

      - name: Assemble release
        working-directory: android
        env:
          LAD_KEYSTORE_PATH: ${{ runner.temp }}/keystore/lad.jks
          LAD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
