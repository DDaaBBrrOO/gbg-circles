<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЛАД — теория на грифе</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app" id="app">
<script>document.getElementById('app').dataset.theme = new URLSearchParams(location.search).get('theme') || 'air';</script>
  <div class="glow" aria-hidden="true"><span></span><span></span></div>

  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>ЛАД</div>
    <div class="top-actions">
      <div class="streak" title="Серия дней подряд">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4c2.9 3.7 5.6 6 5.6 9.5a5.6 5.6 0 0 1-11.2 0c0-1.9 1-3.4 2.5-4.9.9-1 2.1-2.5 3.1-4.6Z"/></svg>
        <span>7</span>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="Включить или выключить звук"></button>
    </div>
  </header>

  <main class="screen" id="screen"></main>

  <nav class="tabbar" aria-label="Разделы">
    <button class="tab" data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.7 12 3.7l8.5 7v8.5a1.8 1.8 0 0 1-1.8 1.8h-4.2v-6.2h-5V21H5.3a1.8 1.8 0 0 1-1.8-1.8Z"/></svg>
      <span>Теория</span>
    </button>
    <button class="tab" data-act="tab" data-tab="circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.1"/><circle cx="12" cy="3.9" r="1.5" fill="currentColor" stroke="none"/><circle cx="20.1" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="20.1" r="1.5" fill="currentColor" stroke="none"/><circle cx="3.9" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      <span>Круг</span>
    </button>
    <button class="tab" data-act="tab" data-tab="neck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 6.5h15M4.5 12h15M4.5 17.5h15M8 4v16M12 4v16M16 4v16"/><circle cx="10" cy="9.2" r="1.35" fill="currentColor" stroke="none"/><circle cx="14" cy="14.8" r="1.35" fill="currentColor" stroke="none"/></svg>
      <span>Гриф</span>
    </button>
    <button class="tab" data-act="tab" data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7.8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2.4v2.4M12 19.2v2.4M2.4 12h2.4M19.2 12h2.4" stroke-linecap="round"/></svg>
      <span>Тренажёр</span>
    </button>
  </nav>
</div>
<script src="assets/app.js"></script>
</body>
</html>
